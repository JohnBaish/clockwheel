<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-backtimer.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backtimer – free backtiming calculator for radio and TV</title>
    <meta name="description" content="Free backtiming calculator for radio and TV. Enter your out-time and items, and see exactly when each one needs to start to hit the news on time." />
    <link rel="canonical" href="https://backtimer.baish.net/" />
    <!-- Search (SEO), 2026-10-17: <title> and the search description are
         written for search engines; the og:/twitter: tags below are for link
         previews and deliberately keep the shorter wording that's drawn into
         the preview picture. The canonical link names the one main address. -->
    <!-- Backtimer's twin of index.html, serving the same app — see that file's
         comment for why this exists, and keep the two in sync for anything
         other than these tags and <title>. Only ever reached via vercel.json's
         rewrite for backtimer.baish.net; the app itself decides what to show
         at runtime via lib/hostMode.ts regardless of which of these two files
         actually loaded it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Backtimer" />
    <meta property="og:description" content="Work out exactly when each item needs to start to hit your out-time." />
    <meta property="og:image" content="https://backtimer.baish.net/og-backtimer.png" />
    <meta property="og:url" content="https://backtimer.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Backtimer" />
    <meta name="twitter:description" content="Work out exactly when each item needs to start to hit your out-time." />
    <meta name="twitter:image" content="https://backtimer.baish.net/og-backtimer.png" />
    <!-- Dark mode: set before the page draws, so there's no flash of the wrong colours. A
         choice kept by the switch wins; otherwise the device's own setting (John, 29 October 2026).
         The same key and rule as src/lib/theme.ts. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('clockwheel-theme') } catch (e) {}
        var device = false
        try { device = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        if (t === 'dark' || (t !== 'light' && device)) document.documentElement.dataset.theme = 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
