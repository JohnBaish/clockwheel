<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clockmaker – free radio hot clock &amp; format clock maker</title>
    <meta name="description" content="Free hot clock maker for radio. Build a format clock for each hour, see it as a circle or a list, plan your week and print it. Works in your browser." />
    <link rel="canonical" href="https://clockmaker.baish.net/" />
    <!-- Search (SEO), 2026-10-17: <title> and the search description are
         written for search engines; the og:/twitter: tags below are for link
         previews and deliberately keep the shorter wording that's drawn into
         the preview picture. The canonical link names the one main address. -->
    <!-- Link-preview ("unfurl") tags for chat apps/social — these are read from
         this static HTML by crawlers that never run the app's JS, so they can't
         just follow lib/hostMode.ts's runtime host check the way the UI does.
         backtimer.html is this file's Backtimer-branded twin — see vite.config.ts
         (multi-entry build) and vercel.json (which domain gets which file). Keep
         both in sync for anything other than these tags and <title>.
         Point at clockmaker.baish.net/og-clockmaker.png (updated 2026-09-30,
         now that John's DNS work for that domain is live) — not
         clockwheel.baish.net, which this app was renamed away from. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clockmaker" />
    <meta property="og:description" content="Display a broadcast hour in a circular layout." />
    <meta property="og:image" content="https://clockmaker.baish.net/og-clockmaker.png" />
    <meta property="og:url" content="https://clockmaker.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clockmaker" />
    <meta name="twitter:description" content="Display a broadcast hour in a circular layout." />
    <meta name="twitter:image" content="https://clockmaker.baish.net/og-clockmaker.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
