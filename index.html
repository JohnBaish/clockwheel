<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clockmaker</title>
    <meta name="description" content="Build broadcast radio clocks, ready to print for any hour." />
    <!-- Link-preview ("unfurl") tags for chat apps/social — these are read from
         this static HTML by crawlers that never run the app's JS, so they can't
         just follow lib/hostMode.ts's runtime host check the way the UI does.
         backtimer.html is this file's Backtimer-branded twin — see vite.config.ts
         (multi-entry build) and vercel.json (which domain gets which file). Keep
         both in sync for anything other than these tags and <title>.
         Point at clockmaker.baish.net/og-clockmaker.png (updated 2026-09-30,
         now that John's DNS work for that domain is live) — not
         clockwheel.baish.net, which this app was renamed away from. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clockmaker" />
    <meta property="og:description" content="Build broadcast radio clocks, ready to print for any hour." />
    <meta property="og:image" content="https://clockmaker.baish.net/og-clockmaker.png" />
    <meta property="og:url" content="https://clockmaker.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clockmaker" />
    <meta name="twitter:description" content="Build broadcast radio clocks, ready to print for any hour." />
    <meta name="twitter:image" content="https://clockmaker.baish.net/og-clockmaker.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
