<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clockmaker</title>
    <meta name="description" content="Build broadcast radio clocks, ready to print for any hour." />
    <!-- Link-preview ("unfurl") tags for chat apps/social — these are read from
         this static HTML by crawlers that never run the app's JS, so they can't
         just follow lib/hostMode.ts's runtime host check the way the UI does.
         backtimer.html is this file's Backtimer-branded twin — see vite.config.ts
         (multi-entry build) and vercel.json (which domain gets which file). Keep
         both in sync for anything other than these tags and <title>.
         og:image/og:url still point at clockwheel.baish.net/og-clockwheel.png —
         deliberate, not a leftover: the app was renamed Clockwheel → Clockmaker
         (2026-09-30) but the domain hasn't moved yet (DNS is John's own
         follow-up), so these still need to point at whatever's actually live.
         Update both the URL and the filename together once the new domain is
         up — see CLAUDE.md's "Renamed Clockwheel → Clockmaker" entry. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clockmaker" />
    <meta property="og:description" content="Build broadcast radio clocks, ready to print for any hour." />
    <meta property="og:image" content="https://clockwheel.baish.net/og-clockwheel.png" />
    <meta property="og:url" content="https://clockwheel.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clockmaker" />
    <meta name="twitter:description" content="Build broadcast radio clocks, ready to print for any hour." />
    <meta name="twitter:image" content="https://clockwheel.baish.net/og-clockwheel.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
